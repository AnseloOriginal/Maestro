<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="manifest" href="./../manifestv2.json" />
    <script src="../nodeless/prescript.js" type="module" fetchpriority="high"></script>
    <script src="./scripts/cdnmath.js" type="module"></script>
    <title> Maestro  </title>
    <link rel="stylesheet" type="text/css" href="styles/main/classes-style.css">
    <link rel="stylesheet" type="text/css" href="styles/main/alert.css">
    <link rel="stylesheet" type="text/css" href="styles/main/testmanagers.css">
    <link rel="stylesheet" type="text/css" href="styles/main/testing.css">
    <link rel="stylesheet" type="text/css" href="styles/main/interact.css">
    <link rel="stylesheet" type="text/css" href="styles/main/account.css">
    <link rel="stylesheet" type="text/css" href="styles/main/general.css">
    <link rel="stylesheet" type="text/css" href="styles/slider.css">
    <link rel="stylesheet" type="text/css" href="styles/main/notes.css">
    <link rel="stylesheet" type="text/css" href="styles/main/monitor.css">
    <link rel="stylesheet" type="text/css" href="styles/main/video.css">
    <link href="./images/material-symbols/outlined.css" rel="stylesheet">
    <link href="./images/material-symbols/rounded.css" rel="stylesheet">
    <link rel="stylesheet" href="./scripts/katex/katex.min.css">
    <script defer src="./scripts/katex/katex.min.js"></script>
    <script defer src="./scripts/katex/contrib/auto-render.min.js"></script>
  </head>
  <body id="root">
    <div class="sidepanels" id="sidepanels" style="opacity: 0; display: none;">
      <button id="switch" class="menu-button">
        <span class="material-symbols-outlined" >menu</span>
      </button>
      <div class="menu-butn" id="main-butn-dashboard">
        <span class="material-symbols-outlined menu-butn-icon" title="Dashboard">home</span>
        <p class="menu-butn-text" name="menu-butn-text"> Dashboard </p>
      </div>
      <div class="menu-butn" id="main-butn-notes">
        <span class="material-symbols-outlined menu-butn-icon" title="Notes">book</span>
        <p class="menu-butn-text" name="menu-butn-text"> Notes </p>
      </div>
      <!-- Depreciated in v1.9.6. Hidden but functionality still intact-->
      <div class="menu-butn" id="main-butn-monitor" style="display: none;">
        <span class="material-symbols-outlined menu-butn-icon" title="Monitor Students">monitor</span>
        <p class="menu-butn-text" name="menu-butn-text"> Monitor </p>
      </div>
      <div class="menu-butn" id="main-butn-test">
        <span class="material-symbols-outlined menu-butn-icon" title="Monitor Students">ink_pen</span>
        <p class="menu-butn-text" name="menu-butn-text"> Tests </p>
      </div>      
      <div class="menu-butn" id="main-butn-testmanager">
        <span class="material-symbols-outlined menu-butn-icon" title="Test Manager">edit_document</span>
        <p class="menu-butn-text" name="menu-butn-text"> Test Manager </p>
      </div>      
      <div class="menu-butn" id="main-butn-account">
        <span class="material-symbols-outlined menu-butn-icon" title="Monitor Students">settings_account_box</span>
        <p class="menu-butn-text" name="menu-butn-text"> Account </p>
      </div>
        <div class="menu-butn" id="main-butn-videos">
        <span class="material-symbols-outlined menu-butn-icon" title="Videos">video_library</span>
        <p class="menu-butn-text" name="menu-butn-text"> Videos </p>
      </div>
      <div class="menu-butn" id="main-butn-interact">
        <span class="material-symbols-outlined menu-butn-icon" title="Interact">room_service</span>
        <p class="menu-butn-text" name="menu-butn-text"> Interact </p>
      </div>      
    </div>
    <div class="content" id="content">
      <div class="alert" id="alert" style="display: none;"></div>
      <div class="content2" id="content2"></div>  
    </div>
    <iframe id="external" style="display: none; left: 0px; top: 100px; width: 100%; border: none;"></iframe>
    <div class="floaters" id="floaters" style="display: absolute;"></div>
    <dialog id="main-dialog" closedby="any"></dialog>
  </body>
  <script src="client/init.ts" type="module"></script>
</html>
